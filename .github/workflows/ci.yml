name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lsec:
    name: lsec (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tooling
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: python -m coverage run -m unittest discover -s tests -t .
      - name: Enforce coverage thresholds
        run: |
          python -m coverage report --fail-under=64
          python -m coverage json -o coverage.json
          python scripts/check-coverage.py coverage.json

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check web assets, i18n tables and docs links
        run: node scripts/check-web.js

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: |
          for script in scripts/*.sh packaging/entrypoint.sh packaging/lsec; do
            sh -n "$script"
          done
      - name: Build deb and source archive
        run: ./scripts/build-release.sh
      - name: Verify artifacts
        run: |
          test -f "dist/lsec_$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/lsec/__init__.py)_all.deb"
          test -f dist/SHA256SUMS
          test -s dist/BUILD-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lsec-package
          path: dist/
          retention-days: 14

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.txt

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lsec, web, packaging, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build release artifacts
        run: ./scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
