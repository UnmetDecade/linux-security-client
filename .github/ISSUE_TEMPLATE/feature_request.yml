name: Feature request
description: Propose a new capability or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the "Explicitly unsupported" list in the README.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Keep lsec's read-only, no-auto-remediation boundary in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning (ClamAV / YARA)
        - Host audit (Lynis / built-in checks)
        - Runtime security (Falco)
        - Wazuh integration
        - Containers
        - Web UI / API / CLI
        - Packaging and deployment
        - Documentation
    validations:
      required: true
